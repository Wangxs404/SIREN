[project]
name = "siren-engineering"
version = "0.1.0"
description = "GUI-first riser response analysis prototype"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "pydantic>=2.7"
]

[project.optional-dependencies]
windows = [
  "pywebview>=5.3",
  "pyinstaller>=6.11",
  "Pillow>=10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
